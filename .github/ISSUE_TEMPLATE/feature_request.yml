name: Feature request
description: Suggest a rule, gate, or workflow improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the tool cannot do today that it should.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want to happen instead.
    validations:
      required: true
