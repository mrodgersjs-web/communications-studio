[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-comm"
version = "11.1.0"
description = "Checks AI-drafted messages against configurable writing rules and blocks the ones that fail"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Mike Rodgers" }
]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
test = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/communications-studio"
Repository = "https://github.com/mrodgersjs-web/communications-studio"
Issues = "https://github.com/mrodgersjs-web/communications-studio/issues"

[project.scripts]
rig = "rig_comm.cli:main"

[tool.setuptools]
packages = ["rig_comm", "rig_comm.integrations", "rig_comm.agentforge"]

[tool.setuptools.package-data]
rig_comm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
