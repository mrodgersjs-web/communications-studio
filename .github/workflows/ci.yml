# CI: ruff and pytest with coverage across Python 3.10 to 3.13.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Tests with coverage
        run: pytest -q --cov=rig_comm --cov-report=term-missing

      - name: Validate example rule set
        run: rig rules-validate examples/rules.yaml

      - name: Run shipped example
        run: python examples/run_example.py

      - name: Backward-compat shims
        run: |
          python src/scoring.py
          python src/gates.py
          python src/formulas.py
          python src/tournament.py
