name: Bug report
description: Something in the gate engine, rules, or CLI is wrong
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Smallest command or snippet that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "11.1.0"
