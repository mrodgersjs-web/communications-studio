[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-comm"
version = "11.0.0"
description = "RIG Communication Protocol V11"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "RIG / Mike Rodgers" }
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
test = ["pytest>=7.4"]

[project.scripts]
rig = "rig_comm.cli:main"

[tool.setuptools]
packages = ["rig_comm", "rig_comm.integrations", "rig_comm.agentforge"]
