# CI: adds ruff and a Python 3.10-3.13 matrix with pytest coverage,
# keeps the doctrine check and the compatibility shims.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Tests with coverage
        run: pytest -q --cov=rig_comm --cov-report=term-missing

      - name: Validate example rule set
        run: rig rules-validate examples/rules.yaml

      - name: Run shipped example
        run: python examples/run_example.py

      - name: Doctrine check
        run: rig doctrine-check --artifact templates/cold-email.md --artifact templates/reply.md

      - name: Backward-compat shims
        run: |
          python src/scoring.py
          python src/gates.py
          python src/formulas.py
          python src/tournament.py
